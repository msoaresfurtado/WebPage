.card:last-child{border-bottom:0}
.card div{white-space:nowrap}
button{background:transparent;color:var(--text-primary);border:0.5px solid var(--border-strong);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
button:hover{background:var(--surface-1)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.ctl{display:flex;align-items:center;gap:12px;margin:12px 0 2px}

function mkP(pts){var n=pts.length,x=pts.map(function(p){return p[0]}),y=pts.map(function(p){return Math.log10(p[1])}),h=[],d=[],m=[];for(var i=0;i<n-1;i++){h[i]=x[i+1]-x[i];d[i]=(y[i+1]-y[i])/h[i]}m[0]=d[0];m[n-1]=d[n-2];for(i=1;i<n-1;i++){if(d[i-1]*d[i]<=0)m[i]=0;else{var w1=2*h[i]+h[i-1],w2=h[i]+2*h[i-1];m[i]=(w1+w2)/(w1/d[i-1]+w2/d[i])}}

function fmt(x){if(x>=1000)return Math.round(+x.toPrecision(4)).toLocaleString('en-US');if(x>=100)return String(Math.round(x));if(x>=1)return String(+x.toPrecision(3));var d=Math.min(12,2-Math.floor(Math.log10(x)));return x.toFixed(d).replace(/0+$/,'').replace(/\.$/,'')}
var WH=['Core: dense and fully ionized. Free-free absorption and bound-free plus bound-bound absorption by heavy elements are about equal, and electron scattering adds about 20 percent. Opacity is lowest here, near 1.','Radiative interior: electron scattering stays near 0.3 while the absorption sources grow as the gas cools, with bound-free and bound-bound absorption leading. Photons still carry the energy.','Base of the convection zone: opacity has climbed to about 21 and the temperature gradient radiation needs now exceeds the adiabatic one. Convection takes over from here outward.','Convective envelope: the gas cools and ions regain electrons, so bound-free and bound-bound absorption keeps climbing and dominates.','Opacity peak near 0.99: opacity reaches about 140,000, driven mostly by helium and hydrogen ionization. It then falls steeply toward the surface.','Photosphere and the layers just below it: the gas is cool and mostly neutral, so electron scattering has almost vanished. Extra electrons attach to hydrogen atoms to make H^-, which controls the opacity in roughly the outermost 200 km (r/R above 0.9997).','Near the surface: opacity falls steeply as hydrogen and helium recombine. Bound-free absorption by hydrogen still dominates until H^- takes over in the last few hundred kilometers.'];
function upd(){var r=+document.getElementById('s').value,o=src(r),d=dom(o.v),t=fT(r),p=fRho(r),w;
w=r<.25?0:r<.65?1:r<.8?2:r<.985?3:r<.996?4:6;if(d==3)w=5;
hs('ro',r.toFixed(Math.max(3,Math.ceil(-Math.log10(ZB-ZA))+3)),15,1);
hs('T',fmtSci(t)+' K',15.8);hs('D',fmtSci(p)+' g/cm^3',15.8);hs('K',fmt(o.tot),15.8);
for(var i=0;i<4;i++){var v=o.v[i],pc=Math.max(0,Math.min(100,(Math.log10(Math.max(v,1e-9))+2)/7.5*100));document.getElementById('br'+i).style.width=pc+'%';hs('bv'+i,fmt(v),13,i==d);var c=document.getElementById('dt'+i),xm=document.getElementById('xm'+i),low=v<Math.pow(10,YLO);c.setAttribute('cx',X(r));c.setAttribute('cy',Y(Math.max(v,Math.pow(10,YLO))));c.setAttribute('visibility',low?'hidden':'visible');xm.setAttribute('visibility',low?'visible':'hidden');xm.setAttribute('transform','translate('+X(r)+','+(Y0+H-9)+')')}
var tt=document.getElementById('dtt');tt.setAttribute('cx',X(r));tt.setAttribute('cy',Y(Math.max(o.tot,Math.pow(10,YLO))));
var m=document.getElementById('mk');m.setAttribute('x1',X(r));m.setAttribute('x2',X(r));
var el=document.getElementById('why');el.innerHTML='<div id="w1" style="margin-bottom:4px"></div><div id="w2"></div>';var srt=[0,1,2,3].sort(function(a,b){return o.v[b]-o.v[a]}),nm=function(i){return S[i].n.toLowerCase().replace('h^-','H^-')};hs('w1','Dominant: '+nm(d)+(o.v[srt[1]]>.8*o.v[srt[0]]?', about tied with '+nm(srt[1]):''),15,1);hs('w2',WH[w],14);sunUpd(r,o,d);photon(r,o)}

var CX=125,CY=122,SR=110,bob=0,curR=.3,curC='#3B6FD4';
var sh='<circle cx="'+CX+'" cy="'+CY+'" r="'+SR+'" fill="#F8CDB0" stroke="#F2B33D" stroke-width="3"/><circle cx="'+CX+'" cy="'+CY+'" r="'+(SR*.713)+'" fill="#F0A44B"/><circle cx="'+CX+'" cy="'+CY+'" r="'+(SR*.25)+'" fill="#F7D154"/>';
sh+='<line x1="'+CX+'" y1="'+CY+'" x2="'+CX+'" y2="'+(CY-SR)+'" stroke="#5A3A22" stroke-width="1" stroke-dasharray="3 3" opacity=".6"/>';
sh+='<circle id="rr" cx="'+CX+'" cy="'+CY+'" r="10" fill="none" stroke="#5A3A22" stroke-width="1" stroke-dasharray="3 3" opacity=".6"/>';
[['Convective zone',-35,.86,-62,'0.71 R to the surface'],['Radiative zone',0,.5,0,'includes the core'],['Core (r < 0.25 R)',35,.12,62,'inside the radiative zone']].forEach(function(l){var a=l[1]*Math.PI/180,px=CX+SR*l[2]*Math.cos(a),py=CY+SR*l[2]*Math.sin(a),ly=CY+l[3];sh+='<polyline points="'+px.toFixed(1)+','+py.toFixed(1)+' '+(CX+SR+14)+','+ly+' '+(CX+SR+24)+','+ly+'" fill="none" stroke="var(--text-secondary)" stroke-width="0.8"/><circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="2" fill="#2B2622"/>'+ST(l[0],CX+SR+30,ly+2,14,'start',tp)+ST(l[4],CX+SR+30,ly+19,12,'start',ts)});
sh+='<g id="pc"><rect x="-11" y="-11" width="22" height="22" rx="5" fill="#3B6FD4" stroke="#2B2622" stroke-width="1.6"/></g>';
sh+='<text id="pl" x="0" y="0" font-size="13" font-weight="600" fill="#2B2622" style="paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round">κ</text>';
document.getElementById('sun').innerHTML=sh;
hs('sunnote','The square is a small volume of gas at the radius you chose.',13);
var reduce=false;try{reduce=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
function place(){var y=CY-curR*SR+bob;document.getElementById('pc').setAttribute('transform','translate('+CX+','+y.toFixed(1)+')');var pl=document.getElementById('pl');pl.setAttribute('x',CX+18);pl.setAttribute('y',(y+4).toFixed(1))}
function sunUpd(r,o,d){curR=r;document.getElementById('rr').setAttribute('r',Math.max(r*SR,1));document.getElementById('pc').firstChild.setAttribute('fill',S[d].c);document.getElementById('pl').textContent='κ = '+fmt(o.tot);place()}

hs('srcnote','Sources: temperature, density, and total opacity come from the standard solar Model S (Christensen-Dalsgaard et al. 1996, OPAL opacities). Scattering is computed from the Thomson cross section with Saha ionization. The split among the absorption types is an estimate.',12);
hs('pt','Share of the opacity at this radius from scattering and from absorption',13);
hs('pnote','These percentages are shares of the average (Rosseland) opacity. They are not the chance that a given photon scatters or is absorbed. That chance depends on the photon\'s energy, and the average is weighted toward the energies where the material is most transparent, because those carry most of the energy outward.',12);
function pct(p){return (p<1?'under 1':String(Math.round(p)))+'%'}
function lab(id,c,t){var el=document.getElementById(id);el.style.fontSize='14px';el.style.lineHeight='1.5';el.innerHTML='<span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:'+c+';margin-right:8px"></span>'+t}
function photon(r,o){var sum=o.v[0]+o.v[1]+o.v[2]+o.v[3],sf=o.v[0]/sum,af=1-sf,m;
document.getElementById('pb1').style.width=(sf*100)+'%';document.getElementById('pb2').style.width=(af*100)+'%';
lab('pl1','#1D9E75','<b style="font-weight:600">Scattering, '+pct(sf*100)+' of the opacity.</b> A photon bounces off a free electron. Its direction changes and its energy barely changes.');
lab('pl2','#B5532A','<b style="font-weight:600">Absorption, '+pct(af*100)+' of the opacity.</b> The surrounding material takes a photon\'s energy and later gives off a new photon, in a random direction.');
if(sf>.5)m='Scattering provides most of the opacity here. Photons bounce around and lose almost no energy, so they wander outward slowly in a random walk.';
else if(sf>.1)m='Both matter here. Scattering only turns a photon around. Absorption moves its energy into the surrounding material, which later gives off new photons at the local temperature.';
else m='Absorption provides almost all of the opacity here. An absorbed photon hands its energy to the surrounding material, which then gives off new photons at the local temperature.';
if(r>=.713)m+=' In this layer, moving material also carries energy outward directly.';
hs('pmsg',m,14)}

var Z=[['Whole Sun',0,1],['Outer 1 percent',.99,1]],zi=0;
function zlabels(){document.getElementById('zbtns').innerHTML=Z.map(function(z,i){return '<button id="zb'+i+'" onclick="setZoom('+i+')" aria-pressed="'+(i==zi)+'" style="'+(i==zi?'border-color:var(--accent);':'')+'"></button>'}).join('');Z.forEach(function(z,i){hs('zb'+i,z[0],15,i==zi)})}
function setZoom(i){zi=i;ZA=Z[i][1];ZB=Z[i][2];var sl=document.getElementById('s');sl.min=ZA;sl.max=ZB;sl.step=(ZB-ZA)/2000;var v=+sl.value;if(v<ZA||v>ZB)sl.value=ZB;drawChart();zlabels();upd()}
function cpick(e){var sv=document.getElementById('sv'),pt=sv.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;var p=pt.matrixTransform(sv.getScreenCTM().inverse());document.getElementById('s').value=Math.max(ZA,Math.min(ZB,ZA+(p.x-X0)/W*(ZB-ZA)));upd()}
zlabels();

var D=[
{t:'Electron scattering',b:'A photon bounces off a free electron. The photon changes direction but keeps almost all of its energy. It does not depend on the photon\'s energy, and it needs free electrons, so it fades where the gas turns neutral. It is 0.27 to 0.35 cm^2/g inside the Sun, depending on how much hydrogen is present, and it sets a floor under the opacity.',e:'Scatters: direction changes, energy barely changes.'},
{t:'Free-free',b:'A photon is absorbed by an electron that is flying past an ion. The ion\'s electric field takes up the extra momentum, which is why a lone electron cannot absorb a photon by itself. Afterward the electron moves faster, so the photon\'s energy has become heat in the gas. The reverse, an electron slowing down near an ion and giving off a photon, is called bremsstrahlung. It needs ionized gas, and it gets stronger as the gas gets denser and cooler.',e:'Absorbs: the gas takes the photon\'s energy.'},
{t:'Bound-free and bound-bound',b:'Bound-free: a photon knocks an electron out of an atom or ion, which ionizes it. The photon needs at least the binding energy, and any extra goes to the electron. Bound-bound: a photon lifts an electron from one level to another inside an atom, which makes absorption lines. Heavy elements such as iron and oxygen matter most inside the Sun. Helium and hydrogen ionization cause the opacity peak near the surface.',e:'Absorbs: the gas takes the photon\'s energy.'},
{t:'H^- ions',b:'A neutral hydrogen atom can hold one extra electron, loosely, with a binding energy of only 0.75 eV. Any photon with more than 0.75 eV, which covers visible light and the near infrared, can pull it off again and is absorbed. This needs cool, mostly neutral gas below roughly 9,000 K, which is why H^- controls the opacity of the photosphere.',e:'Absorbs: the gas takes the photon\'s energy.'},
{t:'Total opacity (Rosseland mean)',b:'Opacity depends on a photon\'s energy, and the gas is much more transparent at some energies than at others. The Rosseland mean combines all of them into one number. It is a weighted average of the inverse of the opacity, so the most transparent energies count the most, because that is where radiation leaks out. It is the right average for energy slowly diffusing through dense gas, and it is the opacity stellar models use. The unit is cm^2/g, the area that blocks light per gram of gas, so a larger number means light escapes more slowly. It is roughly the sum of the four sources.',e:''}];
function showDef(i){var p=document.getElementById('def');if(p.dataset.i==String(i)&&!p.hidden){p.hidden=true;return}p.dataset.i=i;document.getElementById('ddot').style.background=i<4?S[i].c:tp;hs('dh',D[i].t,15,1);hs('db',D[i].b,14);hs('de',D[i].e,13,1);document.getElementById('de').hidden=!D[i].e;p.hidden=false}

function go(v){if(v<ZA||v>ZB)setZoom(0);document.getElementById('s').value=v;upd()}
document.getElementById('s').oninput=upd;upd();
